<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Prison Officer – Active Shift</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    background: #020617;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 1px;
}
.container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
    padding: 15px;
}
.panel {
    background: #020617;
    border-radius: 8px;
    padding: 15px;
}
h3 {
    margin-top: 0;
    color: #fbbf24;
}
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 12px;
    margin: 5px 5px 5px 0;
    border-radius: 5px;
    cursor: pointer;
}
button.danger { background: #dc2626; }
button.warn { background: #ca8a04; }
button:disabled {
    background: #334155;
    cursor: not-allowed;
}
.log {
    font-size: 13px;
    line-height: 1.4;
}
.cellbell {
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
}
.timer {
    color: #f87171;
    font-weight: bold;
}
</style>
</head>
<body>

<header>
🚨 PRISON OFFICER – ACTIVE SHIFT
</header>

<div class="container">

<div class="panel">
<h3>👮 Team Briefing</h3>
<p><b>Houseblock:</b> Main Prisoners A</p>
<p><b>Assigned Wing:</b> Wing A</p>
<p><b>Notes from last shift:</b></p>
<ul>
<li>High Risk prisoner on landing</li>
<li>Increased drug debt tension</li>
<li>Staff short on night shift</li>
</ul>
</div>

<div class="panel">
<h3>⏱ Shift Time</h3>
<p id="time">0 min</p>
</div>

<div class="panel">
<h3>🔔 Active Cell Bells</h3>
<div id="bells"></div>
</div>

<div class="panel">
<h3>📋 Shift Log</h3>
<div id="log" class="log"></div>
</div>

</div>

<script>
let minute = 0;
let bellId = 0;

const log = msg => {
    const div = document.getElementById("log");
    div.innerHTML = "• " + msg + "<br>" + div.innerHTML;
};

const bellsDiv = document.getElementById("bells");

function createBell() {
    bellId++;
    const incident = Math.random() < 0.01;

    const bell = document.createElement("div");
    bell.className = "cellbell";
    bell.id = "bell" + bellId;

    let timeLeft = 5;

    bell.innerHTML = `
        <b>Cell Bell – Wing A</b><br>
        <span class="timer">Time left: ${timeLeft} min</span><br><br>
        <button onclick="respond(${bellId}, ${incident})">Respond</button>
        <button class="warn" onclick="callSupport(${bellId})">Call Support</button>
        <button class="danger" onclick="ignore(${bellId})">Ignore</button>
    `;

    bellsDiv.appendChild(bell);
    log("Cell bell activated – Wing A");

    const interval = setInterval(() => {
        timeLeft--;
        if (!document.getElementById("bell" + bellId)) {
            clearInterval(interval);
            return;
        }
        bell.querySelector(".timer").innerText = "Time left: " + timeLeft + " min";
        if (timeLeft <= 0) {
            log("⚠ Missed cell bell – wing escalation reported");
            bellsDiv.removeChild(bell);
            clearInterval(interval);
        }
    }, 6000);
}

function respond(id, incident) {
    const bell = document.getElementById("bell" + id);
    if (!bell) return;

    if (incident) {
        const events = [
            "Fight in cell – use of force required",
            "Unconscious prisoner – medical emergency",
            "Fire started – emergency response",
            "Seizure – first aid administered"
        ];
        log("🚨 REAL INCIDENT: " + events[Math.floor(Math.random() * events.length)]);
    } else {
        log("Cell bell resolved – routine request");
    }
    bellsDiv.removeChild(bell);
}

function callSupport(id) {
    log("Support team called to Wing A");
    const bell = document.getElementById("bell" + id);
    if (bell) bellsDiv.removeChild(bell);
}

function ignore(id) {
    log("❌ Cell bell ignored – negative record added");
    const bell = document.getElementById("bell" + id);
    if (bell) bellsDiv.removeChild(bell);
}

setInterval(() => {
    minute++;
    document.getElementById("time").innerText = minute + " min";
    if (Math.random() < 0.6) createBell();
}, 6000);

log("Shift started – Wing A");
</script>

</body>
</html>
