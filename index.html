<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Prison Officer – Active Shift</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    background: #020617;
    padding: 12px;
    text-align: center;
    font-weight: bold;
}
.clock {
    font-size: 14px;
    color: #fbbf24;
}
.container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
    padding: 15px;
}
.panel {
    background: #020617;
    border-radius: 8px;
    padding: 15px;
}
h3 { color: #fbbf24; margin-top: 0; }
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 7px 10px;
    margin: 4px;
    border-radius: 5px;
    cursor: pointer;
}
button.warn { background: #ca8a04; }
button.small { font-size: 12px; }
.cellbell {
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
}
.log { font-size: 13px; line-height: 1.4; }
</style>
</head>

<body>

<header>
🚨 PRISON OFFICER – ACTIVE SHIFT 
<div class="clock" id="clock">07:00</div>
</header>

<div class="container">

<div class="panel">
<h3>👮 Assigned Area</h3>
<p><b>Houseblock:</b> Main Prisoners A</p>
<p><b>Wing:</b> A</p>
</div>

<div class="panel">
<h3>🔔 Emergency Cell Bells</h3>
<div id="bells"></div>
</div>

<div class="panel">
<h3>📋 Shift Log</h3>
<div id="log" class="log"></div>
</div>

</div>

<script>
let minute = 0;
let hour = 7;
let gameMinute = 0;
const bellsDiv = document.getElementById("bells");
const logDiv = document.getElementById("log");

const requests = [
    "Could you bring me toilet paper?",
    "My cellmate is acting strange",
    "I feel unwell",
    "There is shouting next door",
    "I lost my canteen sheet",
    "My TV is not working"
];

function log(msg) {
    logDiv.innerHTML = "• " + msg + "<br>" + logDiv.innerHTML;
}

function updateClock() {
    gameMinute++;
    if (gameMinute >= 60) {
        hour++;
        gameMinute = 0;
    }
    document.getElementById("clock").innerText =
        (hour < 10 ? "0" : "") + hour + ":" +
        (gameMinute < 10 ? "0" : "") + gameMinute;
}

function createBell() {
    const bell = document.createElement("div");
    bell.className = "cellbell";

    const request = requests[Math.floor(Math.random() * requests.length)];

    bell.innerHTML = `
        <b>Emergency Cell Bell</b><br>
        <i>Observed:</i> Prisoner using emergency bell<br><br>
        <button onclick="respond(this, '${request}')">Respond</button>
        <button class="warn" onclick="delay(this)">Delay</button>
    `;
    bellsDiv.appendChild(bell);
    log("Emergency cell bell activated");
}

function respond(btn, request) {
    const bell = btn.parentElement;
    bell.innerHTML = `
        <b>Prisoner says:</b><br>
        "${request}"<br><br>
        <button class="small" onclick="answer(this, 'positive')">Yes</button>
        <button class="small" onclick="answer(this, 'neutral')">No</button>
        <button class="small" onclick="answer(this, 'negative')">This is not an emergency</button>
    `;
}

function answer(btn, mood) {
    const bell = btn.parentElement;
    let reaction = "";

    if (mood === "positive") reaction = "🙂 Prisoner calm and cooperative";
    if (mood === "neutral") reaction = "😐 Prisoner disappointed but accepts decision";
    if (mood === "negative") reaction = "😡 Prisoner angry – negative IEP issued";

    log(reaction);
    bellsDiv.removeChild(bell);
}

function delay(btn) {
    log("Cell bell delayed – prisoner waiting");
    bellsDiv.removeChild(btn.parentElement);
}

setInterval(() => {
    updateClock();

    // LOSOWO: 0–4 dzwonki / minuta, czasem zero przez długi czas
    if (Math.random() < 0.3) {
        const amount = Math.floor(Math.random() * 4);
        for (let i = 0; i < amount; i++) createBell();
    }
}, 6000);

log("Shift started – Wing A");
</script>

</body>
</html>
