<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Prison Officer – Shift Simulation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    background: #020617;
    padding: 10px;
    text-align: center;
}
.clock {
    color: #fbbf24;
    font-size: 14px;
}
.container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
    padding: 15px;
}
.panel {
    background: #020617;
    border-radius: 8px;
    padding: 15px;
}
button {
    background: #2563eb;
    border: none;
    color: white;
    padding: 6px 10px;
    margin: 4px 0;
    border-radius: 5px;
    cursor: pointer;
}
button.warn { background: #ca8a04; }
button.bad { background: #b91c1c; }
.cellbell {
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
}
.log { font-size: 13px; line-height: 1.4; }
</style>
</head>

<body>

<header>
🚨 PRISON OFFICER – ACTIVE SHIFT
<div class="clock" id="clock">07:00</div>
</header>

<div class="container">

<div class="panel">
<h3>📋 Team Briefing</h3>
<p><b>Houseblock:</b> 1 – Main Prisoners</p>
<p><b>Wing:</b> A</p>
<p><b>Unlock roll:</b> 48 prisoners</p>
<p><b>High Risk:</b> 2 prisoners</p>
<p><b>ACCT:</b> 1 open</p>
<p><b>Intel:</b> Increased tension after last night</p>
</div>

<div class="panel">
<h3>🔔 Emergency Cell Bells</h3>
<div id="bells"></div>
</div>

<div class="panel">
<h3>🗺️ Wing Map</h3>
<button onclick="openCell('1-A1-10')">Open cell 1-A1-10</button>
<button onclick="openCell('1-A2-07')">Open cell 1-A2-07</button>
</div>

<div class="panel">
<h3>📖 Shift Log</h3>
<div id="log" class="log"></div>
</div>

</div>

<script>
let hour = 7;
let minute = 0;

const clock = document.getElementById("clock");
const bellsDiv = document.getElementById("bells");
const logDiv = document.getElementById("log");

function log(msg) {
    logDiv.innerHTML = "• " + msg + "<br>" + logDiv.innerHTML;
}

function updateClock() {
    minute++;
    if (minute >= 60) {
        minute = 0;
        hour++;
    }
    clock.innerText =
        (hour < 10 ? "0" : "") + hour + ":" +
        (minute < 10 ? "0" : "") + minute;
}

// 1 minuta gry = 30 sekund realnych
setInterval(updateClock, 30000);

// CELL BELLS – bardzo rzadko
setInterval(() => {
    if (Math.random() < 0.15) {
        createBell();
    }
}, 30000);

function createBell() {
    const cell = "1-A1-10";
    const bell = document.createElement("div");
    bell.className = "cellbell";
    bell.innerHTML = `
        <b>Emergency Cell Bell</b><br>
        <i>Location:</i> ${cell}<br><br>
        Prisoner requesting officer presence<br><br>
        <button onclick="respond(this)">Respond</button>
        <button class="warn" onclick="delay(this)">Delay</button>
    `;
    bellsDiv.appendChild(bell);
    log("Cell bell activated at " + cell);
}

function respond(btn) {
    const bell = btn.parentElement;
    bell.innerHTML = `
        Prisoner request:<br>
        "Could you bring me toilet paper?"<br><br>
        <button onclick="decision('warn')">Verbal warning</button><br>
        <button onclick="decision('iep')">Negative IEP</button><br>
        <button onclick="decision('log')">Log only</button><br>
        <button onclick="decision('advice')">Advice & de-escalation</button>
    `;
}

function decision(type) {
    if (type === "warn") log("Prisoner verbally warned");
    if (type === "iep") log("Negative IEP issued");
    if (type === "log") log("Incident logged only");
    if (type === "advice") log("Situation de-escalated successfully");

    bellsDiv.innerHTML = "";
}

function delay(btn) {
    log("Response delayed – prisoner waiting");
    bellsDiv.removeChild(btn.parentElement);
}

function openCell(cell) {
    log("Cell opened: " + cell);
}
</script>

</body>
</html>
