<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Prison Officer – Shift Simulation</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
header {
  background: #020617;
  padding: 10px;
  text-align: center;
}
.clock {
  color: #fbbf24;
  font-size: 14px;
}
nav {
  background: #020617;
  padding: 8px;
  text-align: center;
}
nav button {
  margin: 3px;
}
button {
  background: #2563eb;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
}
button.warn { background: #ca8a04; }
button.bad { background: #b91c1c; }

.tab { display: none; padding: 15px; }
.panel {
  background: #020617;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 15px;
}
input, select {
  width: 100%;
  padding: 6px;
  margin: 5px 0 10px;
}
.flag {
  font-size: 18px;
}
.cellbell {
  border: 1px solid #334155;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.log { font-size: 13px; line-height: 1.4; }
</style>
</head>

<body>

<header>
🚨 PRISON OFFICER
<div class="clock" id="clock"></div>
<div id="officerDisplay"></div>
</header>

<nav id="mainNav" style="display:none">
  <button onclick="showTab('briefing')">Briefing</button>
  <button onclick="showTab('shift')">Active Shift</button>
  <button onclick="showTab('bells')">Cell Bells</button>
  <button onclick="showTab('log')">Shift Log</button>
</nav>

<!-- OFFICER SETUP -->
<section id="setup" class="tab">
  <div class="panel">
    <h2>👮 Officer Setup</h2>

    <label>First Name (staff only)</label>
    <input id="firstName">

    <label>Last Name</label>
    <input id="lastName">

    <label>Alias / Callsign</label>
    <input id="alias">

    <label>How should prisoners address you?</label>
    <select id="address">
      <option value="surname">Surname</option>
      <option value="alias">Alias</option>
    </select>

    <label>Gender</label>
    <select id="gender">
      <option>Male</option>
      <option>Female</option>
    </select>

    <label>Nationality</label>
    <select id="nation"></select>

    <button onclick="saveOfficer()">Start Career</button>
  </div>
</section>

<!-- BRIEFING -->
<section id="briefing" class="tab">
  <div class="panel">
    <h2>📋 Team Briefing</h2>
    <p>Houseblock: 1 – Main Prisoners</p>
    <p>Wing: A</p>
    <p>Unlock roll: 48 prisoners</p>
  </div>
</section>

<section id="shift" class="tab">
  <div class="panel">
    <h2>👮 Active Shift</h2>
    <p>Patrolling assigned wing.</p>
  </div>
</section>

<section id="bells" class="tab">
  <div class="panel">
    <h2>🔔 Emergency Cell Bells</h2>
    <div id="bellsContainer"></div>
  </div>
</section>

<section id="log" class="tab">
  <div class="panel">
    <h2>📖 Shift Log</h2>
    <div id="logContainer" class="log"></div>
  </div>
</section>

<script>
/* EUROPE COUNTRIES */
const europe = [
["United Kingdom","🇬🇧"],["Poland","🇵🇱"],["Germany","🇩🇪"],["France","🇫🇷"],
["Italy","🇮🇹"],["Spain","🇪🇸"],["Netherlands","🇳🇱"],["Belgium","🇧🇪"],
["Sweden","🇸🇪"],["Norway","🇳🇴"],["Denmark","🇩🇰"],["Finland","🇫🇮"],
["Ireland","🇮🇪"],["Portugal","🇵🇹"],["Greece","🇬🇷"],["Czech Republic","🇨🇿"],
["Slovakia","🇸🇰"],["Austria","🇦🇹"],["Switzerland","🇨🇭"],["Romania","🇷🇴"],
["Bulgaria","🇧🇬"],["Hungary","🇭🇺"],["Croatia","🇭🇷"],["Serbia","🇷🇸"],
["Ukraine","🇺🇦"],["Lithuania","🇱🇹"],["Latvia","🇱🇻"],["Estonia","🇪🇪"]
];

const banned = ["hitler","nazi","fuck","cunt","shit"];

const nationSelect = document.getElementById("nation");
europe.forEach(c => {
  const o = document.createElement("option");
  o.value = c[0];
  o.text = c[1] + " " + c[0];
  nationSelect.add(o);
});

/* OFFICER SAVE */
function saveOfficer() {
  const data = {
    first: firstName.value.trim(),
    last: lastName.value.trim(),
    alias: alias.value.trim(),
    address: address.value,
    gender: gender.value,
    nation: nation.value
  };

  if (!data.last || !data.alias) return alert("Last name and alias required.");

  for (let word of banned) {
    if (Object.values(data).join(" ").toLowerCase().includes(word))
      return alert("Inappropriate name detected.");
  }

  localStorage.setItem("officer", JSON.stringify(data));
  location.reload();
}

/* LOAD OFFICER */
const officer = JSON.parse(localStorage.getItem("officer"));

if (!officer) {
  showTab("setup");
} else {
  document.getElementById("mainNav").style.display = "block";
  showTab("briefing");

  const flag = europe.find(e => e[0] === officer.nation)[1];
  const name = officer.address === "alias" ? officer.alias : officer.last;

  document.getElementById("officerDisplay").innerHTML =
    `${flag} Officer ${name}`;
}

/* TABS */
function showTab(id) {
  document.querySelectorAll(".tab").forEach(t => t.style.display = "none");
  document.getElementById(id).style.display = "block";
}

/* CLOCK */
let hour = 7, minute = 0;
const clock = document.getElementById("clock");
setInterval(() => {
  minute++;
  if (minute >= 60) { minute = 0; hour++; }
  clock.innerText = `${hour.toString().padStart(2,"0")}:${minute.toString().padStart(2,"0")}`;
}, 30000);

/* LOG */
const logContainer = document.getElementById("logContainer");
function log(msg) {
  logContainer.innerHTML = "• " + msg + "<br>" + logContainer.innerHTML;
}

/* CELL BELLS */
setInterval(() => {
  if (Math.random() < 0.1) createBell();
}, 30000);

function createBell() {
  const div = document.createElement("div");
  div.className = "cellbell";
  div.innerHTML = `
    Cell bell from 1-A1-10<br><br>
    <button onclick="respond(this)">Respond</button>
    <button class="warn" onclick="delay(this)">Delay</button>
  `;
  bellsContainer.appendChild(div);
}

function respond(btn) {
  btn.parentElement.innerHTML = `
    Prisoner asks for toilet paper.<br><br>
    <button onclick="log('Advice given')">Advice</button>
    <button onclick="log('Verbal warning')">Warning</button>
    <button class="bad" onclick="log('Negative IEP')">Negative IEP</button>
  `;
}

function delay(btn) {
  log("Response delayed");
  btn.parentElement.remove();
}
</script>

</body>
</html>
