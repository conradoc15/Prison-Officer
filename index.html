<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Prison Officer</title>
<style>
body {
    background:#111;
    color:#eee;
    font-family: Arial, sans-serif;
    margin:0;
}
header {
    background:#222;
    padding:15px;
    text-align:center;
    font-size:22px;
}
#container {
    display:flex;
    height:calc(100vh - 60px);
}
#left, #right {
    padding:15px;
    overflow:auto;
}
#left {
    width:65%;
    border-right:2px solid #333;
}
#right {
    width:35%;
}
.box {
    border:1px solid #444;
    padding:10px;
    margin-bottom:10px;
}
button {
    background:#444;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
}
button:hover {
    background:#666;
}
.alert {
    color:#ff5555;
}
.good {
    color:#55ff55;
}
</style>
</head>

<body>

<header>
🚨 PRISON OFFICER – ACTIVE SHIFT
</header>

<div id="container">

<div id="left">
    <div class="box" id="briefingBox">
        <h3>👥 Team Briefing</h3>
        <ul id="briefing"></ul>
        <button onclick="startShift()">Start Shift</button>
    </div>

    <div class="box" id="prisonBox" style="display:none;">
        <h3>🏢 Houseblocks</h3>
        <div id="houseblocks"></div>
    </div>
</div>

<div id="right">
    <div class="box">
        <h3>⏱️ Shift Time</h3>
        <div id="time">Not started</div>
    </div>

    <div class="box">
        <h3>🔔 Active Cell Bells</h3>
        <ul id="bells"></ul>
    </div>

    <div class="box">
        <h3>📋 Shift Log</h3>
        <ul id="log"></ul>
    </div>
</div>

</div>

<script>
let shiftStarted = false;
let time = 0;
let bells = [];

const houseblocks = [
    "VP Wing",
    "Induction Wing",
    "Main Prisoners A",
    "Medication Wing",
    "Enhanced Prisoners",
    "Main Prisoners B"
];

function random(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function log(text){
    const li = document.createElement("li");
    li.textContent = text;
    document.getElementById("log").prepend(li);
}

function generateBriefing(){
    const notes = [
        "Staff shortage on Main Prisoners A",
        "High Risk prisoner located in Induction Wing",
        "Previous shift reported contraband",
        "Medication delays reported",
        "Segregation Unit near capacity",
        "Reception expecting new arrivals"
    ];
    const ul = document.getElementById("briefing");
    notes.sort(()=>0.5-Math.random()).slice(0,3).forEach(n=>{
        const li = document.createElement("li");
        li.textContent = n;
        ul.appendChild(li);
    });
}

function startShift(){
    shiftStarted = true;
    document.getElementById("briefingBox").style.display="none";
    document.getElementById("prisonBox").style.display="block";
    log("Shift started");
}

function updateTime(){
    if(!shiftStarted) return;
    time++;
    document.getElementById("time").textContent = time + " min";
}

function spawnBell(){
    if(!shiftStarted) return;
    if(Math.random()<0.4){
        const isIncident = Math.random()<0.01;
        const bell = {
            id: Date.now(),
            block: random(houseblocks),
            timer: 5,
            incident: isIncident
        };
        bells.push(bell);
        log("Cell bell activated in " + bell.block);
    }
}

function updateBells(){
    const ul = document.getElementById("bells");
    ul.innerHTML="";
    bells.forEach(b=>{
        const li = document.createElement("li");
        li.innerHTML = `${b.block} – ${b.timer} min ${b.incident ? "<span class='alert'>REAL INCIDENT</span>" : ""}`;
        ul.appendChild(li);
        b.timer--;
        if(b.timer<=0){
            log(b.incident ? "❗ Incident escalated due to no response" : "Bell unanswered");
        }
    });
    bells = bells.filter(b=>b.timer>0);
}

function drawHouseblocks(){
    const div = document.getElementById("houseblocks");
    div.innerHTML="";
    houseblocks.forEach(h=>{
        const p = document.createElement("p");
        p.textContent = "• " + h;
        div.appendChild(p);
    });
}

generateBriefing();
drawHouseblocks();

setInterval(updateTime, 60000);
setInterval(spawnBell, 30000);
setInterval(updateBells, 60000);
</script>

</body>
</html>
